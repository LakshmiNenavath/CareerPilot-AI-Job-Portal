<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head('AI Prompt Management - CareerPilot AI Admin')}"></head>
<body>
    <div th:replace="~{admin/admin-nav :: admin-bar('prompts')}"></div>

    <main class="content-wrapper">
        <div class="container" style="padding-top: 2rem; max-width: 1050px;">
            <!-- Header title & actions -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); padding: 0.3rem 0.9rem; border-radius: var(--radius-full); margin-bottom: 0.6rem;">
                        <span style="font-size: 0.8rem; font-weight: 700; color: #fbbf24;">LIVE PROMPT ENGINEERING</span>
                    </div>
                    <h1 style="font-size: 2.2rem; margin-bottom: 0.3rem;">AI Prompt Management</h1>
                    <p style="color: var(--text-sub); font-size: 0.95rem;">
                        Customize how the AI analyzes resumes and conducts mock interviews on the fly — <strong>no code changes or server restarts required!</strong>
                    </p>
                </div>

                <div>
                    <form th:action="@{/admin/prompts/reset}" method="POST" onsubmit="return confirm('Reset all AI prompts to factory defaults? Your custom changes will be overwritten.');">
                        <button type="submit" class="btn btn-secondary btn-sm" style="color: #fbbf24; border-color: rgba(245, 158, 11, 0.3);">
                            ↺ Reset to Factory Defaults
                        </button>
                    </form>
                </div>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <!-- Prompts List -->
            <div style="display: flex; flex-direction: column; gap: 2.2rem; margin-bottom: 3.5rem;">
                <div th:each="prompt : ${prompts}" class="card card-glass" style="border: 1px solid rgba(59, 130, 246, 0.3); padding: 2rem;">
                    <form th:action="@{/admin/prompts/save}" method="POST">
                        <input type="hidden" name="promptKey" th:value="${prompt.promptKey}">

                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem;">
                            <div>
                                <span class="badge badge-primary" style="margin-bottom: 0.4rem;" th:text="${prompt.promptKey}">KEY</span>
                                <h3 style="font-size: 1.35rem; color: #fff;" th:text="${prompt.title}">Prompt Title</h3>
                                <p style="color: var(--text-sub); font-size: 0.88rem; margin-top: 0.2rem;" th:text="${prompt.description}">Description</p>
                            </div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">
                                Last Updated: <span th:text="${#temporals.format(prompt.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-10-03</span>
                            </div>
                        </div>

                        <!-- Variables Helper Banner -->
                        <div style="background: rgba(10, 14, 23, 0.6); padding: 0.8rem 1rem; border-radius: var(--radius-sm); border-left: 3px solid #f59e0b; margin-bottom: 1.2rem; font-size: 0.85rem;">
                            <strong style="color: #fbbf24;">Supported Variables:</strong>
                            <code style="color: #60a5fa; margin-left: 0.5rem;" th:text="${prompt.variablesHelp}">{role}, {skills}, etc.</code>
                        </div>

                        <!-- Editable Fields -->
                        <div class="form-group">
                            <label class="form-label">Display Title</label>
                            <input type="text" name="title" class="form-control" th:value="${prompt.title}" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description / Internal Notes</label>
                            <input type="text" name="description" class="form-control" th:value="${prompt.description}">
                        </div>

                        <div class="form-group">
                            <label class="form-label">AI Prompt Template Text (Live Editable)</label>
                            <textarea name="templateText" class="form-control" rows="12" style="font-family: monospace; font-size: 0.88rem; line-height: 1.6;" th:text="${prompt.templateText}"></textarea>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 1rem; align-items: center; margin-top: 1.2rem;">
                            <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.6rem;">
                                💾 Save Changes to DB
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
